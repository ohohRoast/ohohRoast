<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ohohRoast – Christmas video roasts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#120b0e">
<meta property="og:title" content="Someone got you a Christmas roast">
<meta property="og:description" content="A personalized, merciless Christmas video. Make yours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#120b0e;--card:#1e1318;--line:#3a2630;--text:#f6ede8;--mute:#b7a3a8;--red:#e8324a;--gold:#f3c56b;--ok:#4ad295}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#3a1420 0,var(--bg) 60%);color:var(--text);font:16px/1.5 'Fredoka',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:26px;margin:8px 0 4px;font-weight:600}
.logo-img{display:block;width:min(300px,80%);height:auto;margin:0 0 4px -6px}
.logo{font-family:'Lilita One','Fredoka',system-ui,sans-serif;font-size:46px;line-height:1;color:var(--gold);text-shadow:0 3px 0 var(--red);letter-spacing:.5px;margin:4px 0 8px}
.logo span{color:#fff}
h2{font-size:20px;margin:0 0 12px;font-weight:600}
p.sub{color:var(--mute);margin:0 0 20px}
.brand{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input,select,textarea{width:100%;background:#120b0e;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);border-color:transparent}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:14px 18px;background:var(--red);color:#fff;font-weight:700;width:100%;margin-top:16px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px}.row>*{flex:1}
.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.char{border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;cursor:pointer;background:#120b0e}
.char img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#2a1a21;display:block}
.char.sel{border-color:var(--red)}
.char span{display:block;margin-top:6px;font-size:14px}
.opt{border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;cursor:pointer;background:#120b0e}
.opt.sel{border-color:var(--red)}
.opt small{color:var(--gold);text-transform:uppercase;letter-spacing:.6px;font-size:11px}
.opt p{margin:6px 0 0}
.tones{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tone{border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:#120b0e}
.tone.sel{border-color:var(--red)}
.tone b{display:block}.tone span{color:var(--mute);font-size:12px}
.err{background:#3a1018;border:1px solid var(--red);color:#ffd7dc;padding:10px 12px;border-radius:10px;margin:12px 0}
.mute{color:var(--mute);font-size:13px}
video{width:100%;border-radius:14px;background:#000;max-height:70vh}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:s 1s linear infinite;margin:18px auto}
@keyframes s{to{transform:rotate(360deg)}}
.center{text-align:center}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo-img" src="logo.png" alt="ohohRoast" width="993" height="205">
  <h1 id="title">Get roasted by Christmas</h1>
  <p class="sub" id="sub">A personalized video message for someone who can take a joke.</p>
  <div id="app"></div>
</div>

<script>
// ============ SETTINGS: fill these two in (see SETUP.md) ============
const SUPABASE_URL = "https://zaqvzpxfzzgrubqydnhu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1Wvo-dG6Cu4aToTRl0-sdA_nFMWcGq_"; // publishable key: safe to be public
// ====================================================================
const API = SUPABASE_URL + "/functions/v1/api";
const $app = document.getElementById("app");
let CFG = null;
const S = { order: null, token: null, id: null, sel: {}, busy: false, pollTimer: null, started: 0 };

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function eur(c){return "€"+(c/100).toFixed(2);}

async function api(action, body){
  const r = await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},body:JSON.stringify(Object.assign({action},body||{}))});
  let j={}; try{j=await r.json();}catch(e){}
  if(!r.ok||j.error) throw new Error(j.error||"Something went wrong. Please try again.");
  return j;
}
function save(){ try{localStorage.setItem("santa_order",JSON.stringify({id:S.id,token:S.token}));}catch(e){} }
function load(){ try{return JSON.parse(localStorage.getItem("santa_order")||"null");}catch(e){return null;} }
function clearOrder(){ try{localStorage.removeItem("santa_order");}catch(e){} S.id=S.token=S.order=null; history.replaceState(null,"",location.pathname); }
function showErr(msg){ const e=document.getElementById("err"); if(e){e.textContent=msg; e.classList.remove("hide");} }
function stopPoll(){ if(S.pollTimer){clearInterval(S.pollTimer);S.pollTimer=null;} }

// ---------- routing ----------
async function boot(){
  const q = new URLSearchParams(location.search);
  try{
    if(q.get("v")){ return await viewShared(q.get("v")); }
    CFG = await api("config");
    if(q.get("o") && q.get("k")){
      S.id=q.get("o"); S.token=q.get("k"); save();
      if(q.get("session_id")){
        try{ await api("confirm-payment",{order_id:S.id,token:S.token,session_id:q.get("session_id")}); }catch(e){ return renderMsg("Payment not confirmed yet",e.message+" If you paid, wait a few seconds and refresh this page."); }
      }
      history.replaceState(null,"",location.pathname);
    } else { const o=load(); if(o){S.id=o.id;S.token=o.token;} }
    if(S.id){
      try{ const r=await api("get-order",{order_id:S.id,token:S.token}); S.order=r.order; return route(); }
      catch(e){ clearOrder(); }
    }
    renderStart();
  }catch(e){ renderMsg("We hit a problem", e.message); }
}

function route(){
  stopPoll();
  const o=S.order;
  if(!o.paid) return renderStart();
  if(o.status==="paid") return renderForm();
  if(o.status==="scripted") return renderScripts();
  if(o.status==="rendering") return renderRendering();
  if(o.status==="done") return renderDone();
  if(o.status==="failed") return renderMsg("Your video hit a snag", (o.error||"")+" Your order is safe. Contact us and we will sort it out.");
  renderStart();
}

function renderMsg(t,m){ stopPoll(); $app.innerHTML=`<div class="card"><h2>${esc(t)}</h2><p>${esc(m)}</p><button class="ghost" onclick="location.href=location.pathname">Back to start</button></div>`; }

// ---------- viewing a shared video ----------
async function viewShared(id){
  document.getElementById("title").textContent="Someone sent you a roast";
  document.getElementById("sub").textContent="";
  try{
    const r=await api("watch",{order_id:id});
    $app.innerHTML=`<video controls playsinline autoplay src="${esc(r.video_url)}"></video>
      <button onclick="location.href=location.pathname">Make your own roast</button>`;
  }catch(e){ renderMsg("Video not found","This link is not valid."); }
}

// ---------- step 1: start (choose quality, pay) ----------
function renderStart(){
  const free = CFG.payment_mode!=="stripe";
  $app.innerHTML=`
  <div class="card">
    <h2>1. Choose your quality</h2>
    <label><input type="radio" name="res" value="480p" checked style="width:auto"> Standard 480p – ${eur(CFG.price_480)}</label>
    <label><input type="radio" name="res" value="720p" style="width:auto"> HD 720p – ${eur(CFG.price_480+CFG.upgrade_720)}</label>
    ${free?`<label>Test code</label><input id="code" autocomplete="off" placeholder="Test access code">`:""}
    <div id="err" class="err hide"></div>
    <button id="go">${free?"Start (test mode)":"Pay and continue"}</button>
    <p class="mute">You write the details after payment, pick your favourite of 3 jokes, and we make the video.</p>
  </div>`;
  document.getElementById("go").onclick=async function(){
    this.disabled=true;
    try{
      const res=document.querySelector("input[name=res]:checked").value;
      const code=document.getElementById("code");
      const r=await api("create-order",{resolution:res,test_code:code?code.value:"",return_url:location.origin+location.pathname});
      S.id=r.order_id;S.token=r.token;save();
      if(r.checkout_url){ location.href=r.checkout_url; return; }
      const g=await api("get-order",{order_id:S.id,token:S.token}); S.order=g.order; route();
    }catch(e){ this.disabled=false; showErr(e.message); }
  };
}

// ---------- step 2: form ----------
function renderForm(){
  const o=S.order, f=o.form||{}, sel=S.sel;
  sel.character=sel.character||f.character||CFG.characters[0].id;
  sel.language=sel.language||f.language||CFG.languages[0].id;
  sel.tone=sel.tone||f.tone||"roast";
  const facts=f.facts||[];
  $app.innerHTML=`
  <div class="card"><h2>2. Who is speaking?</h2>
    <div class="chars">${CFG.characters.map(c=>`<div class="char ${sel.character===c.id?"sel":""}" data-c="${c.id}"><img src="${esc(c.image)}" alt="" onerror="this.style.visibility='hidden'"><span>${esc(c.label)}</span></div>`).join("")}</div>
    <label>Language</label>
    <select id="lang">${CFG.languages.map(l=>`<option value="${l.id}" ${sel.language===l.id?"selected":""}>${esc(l.label)}</option>`).join("")}</select>
  </div>
  <div class="card"><h2>3. How brutal?</h2>
    <div class="tones">${CFG.tones.map(t=>`<div class="tone ${sel.tone===t.id?"sel":""}" data-t="${t.id}"><b>${esc(t.label)}</b><span>${esc(t.hint)}</span></div>`).join("")}</div>
  </div>
  <div class="card"><h2>4. Tell us about them</h2>
    <div class="row"><div><label>Their first name</label><input id="rn" maxlength="30" value="${esc(f.recipient_name||"")}"></div>
    <div><label>Nickname (optional)</label><input id="nn" maxlength="30" value="${esc(f.nickname||"")}"></div></div>
    <label>What are they to you?</label>
    <select id="rel">${CFG.relationships.map(r=>`<option value="${r.id}" ${f.relationship===r.id?"selected":""}>${esc(r.label)}</option>`).join("")}</select>
    <label>Fact 1 (job, hobby, a quirk…)</label><input class="fact" maxlength="80" value="${esc(facts[0]||"")}" placeholder="Always late to everything">
    <label>Fact 2 (optional)</label><input class="fact" maxlength="80" value="${esc(facts[1]||"")}">
    <label>Fact 3 (optional)</label><input class="fact" maxlength="80" value="${esc(facts[2]||"")}">
    <label>A naughty-list story (optional)</label><textarea id="story" maxlength="300">${esc(f.story||"")}</textarea>
    <label>Who is the message from?</label><input id="sn" maxlength="30" value="${esc(f.sender_name||"")}">
    <div id="err" class="err hide"></div>
    <button id="gen">Write my 3 jokes</button>
  </div>`;
  document.querySelectorAll(".char").forEach(el=>el.onclick=()=>{sel.character=el.dataset.c;document.querySelectorAll(".char").forEach(x=>x.classList.toggle("sel",x===el));});
  document.querySelectorAll(".tone").forEach(el=>el.onclick=()=>{sel.tone=el.dataset.t;document.querySelectorAll(".tone").forEach(x=>x.classList.toggle("sel",x===el));});
  document.getElementById("lang").onchange=e=>{sel.language=e.target.value;};
  document.getElementById("gen").onclick=()=>generate(collectForm());
}
function collectForm(){
  return {character:S.sel.character,language:document.getElementById("lang").value,tone:S.sel.tone,
    recipient_name:document.getElementById("rn").value,nickname:document.getElementById("nn").value,
    relationship:document.getElementById("rel").value,facts:[...document.querySelectorAll(".fact")].map(x=>x.value),
    story:document.getElementById("story").value,sender_name:document.getElementById("sn").value};
}
async function generate(form){
  if(S.busy) return; S.busy=true;
  const btn=document.getElementById("gen")||document.getElementById("reroll"); if(btn){btn.disabled=true;btn.textContent="Writing jokes… (about 20 seconds)";}
  try{
    const r=await api("generate-scripts",{order_id:S.id,token:S.token,form});
    S.order=r.order; S.pick=null; S.busy=false; route();
  }catch(e){ S.busy=false; if(btn){btn.disabled=false;btn.textContent=btn.id==="gen"?"Write my 3 jokes":"Write 3 new jokes";} showErr(e.message); }
}

// ---------- step 3: pick a script ----------
function renderScripts(){
  const o=S.order;
  $app.innerHTML=`
  <div class="card"><h2>5. Pick your favourite</h2>
    <p class="mute">Once you pick one, we make the video and it cannot be changed.</p>
    ${o.scripts.map((s,i)=>`<div class="opt ${S.pick===i?"sel":""}" data-i="${i}"><small>Option ${i+1}</small><p>${esc(s.text)}</p></div>`).join("")}
    <div id="err" class="err hide"></div>
    <button id="make" ${S.pick==null?"disabled":""}>Make my video</button>
    ${o.rerolls_left>0?`<button class="ghost" id="reroll">Write 3 new jokes (${o.rerolls_left} left)</button>`:""}
    <button class="ghost" id="edit">Edit my details</button>
  </div>`;
  document.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{S.pick=+el.dataset.i;document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===el));document.getElementById("make").disabled=false;});
  document.getElementById("make").onclick=async function(){
    if(S.pick==null) return;
    if(!confirm("Make the video with this joke? This cannot be changed afterwards.")) return;
    this.disabled=true; this.textContent="Starting…";
    try{ const r=await api("select-script",{order_id:S.id,token:S.token,index:S.pick}); S.order=r.order; route(); }
    catch(e){ this.disabled=false; this.textContent="Make my video"; showErr(e.message); }
  };
  const rr=document.getElementById("reroll"); if(rr) rr.onclick=()=>generate(o.form);
  document.getElementById("edit").onclick=()=>{ S.order=Object.assign({},o,{status:"paid"}); renderForm(); };
}

// ---------- step 4: rendering ----------
function renderRendering(){
  S.started=S.started||Date.now();
  $app.innerHTML=`<div class="card center"><h2>Santa is filming…</h2><div class="spin"></div>
    <p id="msg">This takes about 1 to 3 minutes. You can leave this page open, or come back later on this same device.</p></div>`;
  stopPoll();
  const tick=async()=>{
    try{
      const r=await api("status",{order_id:S.id,token:S.token}); S.order=r.order;
      if(r.order.status!=="rendering"){ stopPoll(); route(); }
    }catch(e){}
  };
  S.pollTimer=setInterval(tick,5000); tick();
}

// ---------- step 5: done ----------
function renderDone(){
  const o=S.order, shareUrl=location.origin+location.pathname+"?v="+o.id;
  $app.innerHTML=`
  <video controls playsinline src="${esc(o.video_url)}"></video>
  <div class="card">
    <button id="share">Share</button>
    <a href="${esc(o.video_url)}" download="roast.mp4" target="_blank" rel="noopener"><button class="ghost" type="button">Download video</button></a>
    <button class="ghost" id="copy">Copy link</button>
    <button class="ghost" id="new">Make another</button>
  </div>`;
  document.getElementById("share").onclick=async()=>{
    const text="I just got roasted by Christmas 🎅 @ohohRoast";
    try{
      const blob=await (await fetch(o.video_url)).blob();
      const file=new File([blob],"roast.mp4",{type:"video/mp4"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text}); return; }
    }catch(e){}
    if(navigator.share){ try{ await navigator.share({text,url:shareUrl}); return; }catch(e){} }
    window.open("https://wa.me/?text="+encodeURIComponent(text+" "+shareUrl),"_blank");
  };
  document.getElementById("copy").onclick=async function(){ try{await navigator.clipboard.writeText(shareUrl);this.textContent="Copied!";}catch(e){prompt("Copy this link",shareUrl);} };
  document.getElementById("new").onclick=()=>{clearOrder();location.reload();};
}

boot();
</script>
</body>
</html>
